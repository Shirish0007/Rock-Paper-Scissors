<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <div class="scoreboard">
            <div class="score" id="playerScore">  </div> 
            <div class="score" id="computerScore">  </div>
        </div>
        <div class="choices">
            <button class="choice" id="rock" onclick="play('ROCK')">✊</button>
            <button class="choice" id="paper" onclick="play('PAPER')">✋</button>
            <button class="choice" id="scissors" onclick="play('SCISSORS')">✌️</button>  
        </div>

        <div id="scoreBoard"> Player Score: <span id="playerScoreDisplay">0</span>
        </div>
    
        <div id="scoreBoard"> Computer Score: <span id="computerScoreDisplay">0</span>
        </div> 


        <div class="result" id="result"></div>
        <button class="reset" onclick="resetGame()">Reset Game</button>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
